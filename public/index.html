<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mirai - Watch Anime Online, Free Anime Streaming</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon-180.png">

    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/site-bottom-button.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="brand">
        <img src="assets/mirai-logo.png" alt="Mirai Anime">
    </div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue watching on Mirai 🚀</p>

    <p class="error-msg" id="errorMsg">Please fill in your email and password.</p>

    <form id="loginForm">

        <div class="group">
            <label>Email Address</label>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="john@example.com" required>
            </div>
        </div>

        <div class="group">
            <label>Password</label>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="******" required>
            </div>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit">
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
        </button>

    </form>

    <p class="or">or sign in with</p>

    <div class="social">
        <button type="button">
            <i class="fa-brands fa-google"></i>
            Google
        </button>

        <button type="button">
            <i class="fa-brands fa-discord"></i>
            Discord
        </button>
    </div>

    <div class="bottom">
        Don't have an account?
        <a href="register.html">Create one</a>
    </div>

    <a href="#" class="skip-link" id="guestLink"><i class="fa-solid fa-user"></i> Continue as Guest</a>

</div>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
